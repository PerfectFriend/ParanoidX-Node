version: 1.0.0

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  bip39: ^1.0.6
  bip32: ^2.0.0
  ed25519_hd_key: ^2.0.0
  crypto: ^3.0.3
  pointycastle: ^3.8.0
