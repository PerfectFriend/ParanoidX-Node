  <!-- Center node dot -->
  <circle cx="64" cy="60" r="12" fill="#1b5e20" opacity="0.2"/>
  <circle cx="64" cy="60" r="8" fill="#1b5e20" opacity="0.3"/>
  <!-- 3 connection lines -->
  <line x1="64" y1="60" x2="64" y2="20" stroke="#1b5e20" stroke-width="2" opacity="0.4"/>
  <line x1="64" y1="60" x2="40" y2="45" stroke="#1b5e20" stroke-width="2" opacity="0.4"/>
  <line x1="64" y1="60" x2="88" y2="45" stroke="#1b5e20" stroke-width="2" opacity="0.4"/>
  <!-- Small endpoint dots -->
  <circle cx="64" cy="20" r="4" fill="#1b5e20" opacity="0.5"/>
  <circle cx="40" cy="45" r="4" fill="#1b5e20" opacity="0.5"/>
  <circle cx="88" cy="45" r="4" fill="#1b5e20" opacity="0.5"/>
  <!-- Letter S -->
  <text x="64" y="90" text-anchor="middle" font-family="sans-serif" font-size="28"
