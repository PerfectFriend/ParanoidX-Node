<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00c853"/>
      <stop offset="100%" stop-color="#00e676"/>
    </linearGradient>
    <linearGradient id="gd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#ffb74d"/>
    </linearGradient>
    <linearGradient id="gr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#ef5350"/>
    </linearGradient>
  </defs>
  <!-- Shield -->
  <path d="M64 8 L116 32 L116 60 C116 92 92 112 64 124 C36 112 12 92 12 60 L12 32 Z"
        fill="url(#g)" stroke="#1b5e20" stroke-width="2"/>
  <!-- Inner shield -->
  <path d="M64 16 L108 36 L108 60 C108 88 88 106 64 116 C40 106 20 88 20 60 L20 36 Z"
