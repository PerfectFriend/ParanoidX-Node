name: simplex-node

services:
  smp-server:
    image: simplexchat/smp-server:latest
    container_name: simplex-node-smp-server
    environment:
      - ADDR=simplex-node.local
    volumes:
      - ./smp_configs:/etc/opt/simplex
      - ./smp_state:/var/opt/simplex
    ports:
      - "5223:5223"
      - "127.0.0.1:5224:5224"
    restart: unless-stopped
    depends_on:
      - tor
    healthcheck:
      test: ["CMD", "smp-server", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  xftp-server:
    image: simplexchat/xftp-server:latest
    container_name: simplex-node-xftp-server
    environment:
      - ADDR=simplex-node.local
      - QUOTA=20gb
    volumes:
      - ./xftp_configs:/etc/opt/simplex-xftp
      - ./xftp_state:/srv/xftp
    ports:
      - "5225:443"
      - "127.0.0.1:5226:5226"
    restart: unless-stopped
    depends_on:
      - tor
    healthcheck:
      test: ["CMD", "xftp-server", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Custom Tor with true host-persistent hidden services.
  # The entrypoint starts as root (to reliably fix permissions on bind mounts),
  # prepares the directories, then drops privileges and runs tor as the normal user.
  # This guarantees the .onion keys on the host are always owned by your user.
  tor:
    build:
      context: ./tor
      dockerfile: Dockerfile
    container_name: simplex-node-tor
    # No user: here — entrypoint handles privilege drop after fixing bind mount perms
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "tor", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - ./tor/torrc:/etc/tor/torrc:ro
      # Real persistent hidden service keys live on the HOST here
      - ./tor/hidden_services/smp:/var/lib/tor/smp
      - ./tor/hidden_services/xftp:/var/lib/tor/xftp
      - ./tor/hidden_services/dashboard:/var/lib/tor/dashboard
      - ./tor/hidden_services/ice:/var/lib/tor/ice
      - ./tor/hidden_services/auditor:/var/lib/tor/auditor
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Custom TURN/ICE server for WebRTC voice calls, hidden behind .onion
  # Uses TCP for compatibility with Tor hidden services.
  # v2ray: заменён на нативный xray бинарник ~/bin/v2ray/xray

  coturn:
    image: coturn/coturn:latest
    container_name: simplex-node-coturn
    restart: unless-stopped
    user: "1000:1000"  # match host user
    command: -c /etc/coturn/turnserver.conf --log-file=stdout
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./coturn/turn_cert.pem:/etc/coturn/turn_cert.pem:ro
      - ./coturn/turn_key.pem:/etc/coturn/turn_key.pem:ro
    depends_on:
      - tor
    healthcheck:
      test: ["CMD-SHELL", "test -f /proc/1/cmdline && cat /proc/1/cmdline | tr '\\0' ' ' | grep -q turnserver"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # No direct ports; only accessible via Tor HS or local for testing if needed
    # For local testing you can temporarily add ports, but normally onion only.
